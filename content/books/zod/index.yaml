title: 'Zod入門 — TypeScriptで実行時の入力検証を型と一緒に書く'
description: 'TypeScriptの型はコンパイル後に消えるため、フォーム・API・環境変数から届くデータは型注釈では守れません。Zodはスキーマを1つ書くだけで、実行時の検証と静的な型の両方を用意してくれます。基本スキーマ、parseとsafeParseの違い、空文字やnullの扱い、refine・transform、エラーメッセージの日本語化、React Hook Form連携、Zod 3から4への移行までを実務目線で解説します。'
