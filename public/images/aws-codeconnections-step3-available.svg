<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">接続の作成後の画面</title>
  <desc id="desc">接続のステータスが利用可能と表示され、ARNに作成したリージョン名が含まれている画面の簡略図。</desc>
  <rect width="800" height="250" rx="16" fill="#f1f5f9"/>
  <rect x="20" y="20" width="760" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="64" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">my-github-connection</text>
  <text x="48" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#475569">プロバイダー</text>
  <text x="48" y="134" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#334155">GitHub</text>
  <text x="300" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#475569">ステータス</text>
  <circle cx="310" cy="128" r="9" fill="#15803d"/>
  <path d="M305 128l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="328" y="134" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#15803d">利用可能</text>
  <text x="48" y="172" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#475569">ARN</text>
  <text x="48" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#334155">arn:aws:codeconnections:<tspan font-weight="700" fill="#c2410c">ap-northeast-1</tspan>:123456789012:connection/a1b2c3d4-...</text>
</svg>
