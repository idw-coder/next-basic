<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">GitリポジトリとECRリポジトリの違い</title>
  <desc id="desc">Gitリポジトリはソースコードとコミットを保管し、Docker buildとpushを経て、ECRリポジトリにはDockerイメージとタグが保管されることを示す図。</desc>
  <rect width="960" height="420" rx="28" fill="#f8fafc"/>
  <rect x="28" y="28" width="904" height="364" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="480" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0f172a">同じ「リポジトリ」でも中身が違う</text>

  <rect x="80" y="118" width="300" height="190" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="230" y="158" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#1d4ed8">Gitリポジトリ</text>
  <text x="230" y="190" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#334155">ソースコードを保管</text>

  <rect x="125" y="215" width="48" height="62" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <path d="M163 215v16h10" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <line x1="137" y1="239" x2="161" y2="239" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="137" y1="253" x2="161" y2="253" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="137" y1="267" x2="153" y2="267" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <circle cx="222" cy="229" r="8" fill="#2563eb"/>
  <circle cx="222" cy="250" r="8" fill="#2563eb"/>
  <circle cx="222" cy="271" r="8" fill="#2563eb"/>
  <line x1="222" y1="237" x2="222" y2="242" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="258" x2="222" y2="263" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="282" y="236" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#475569">commit</text>
  <text x="282" y="265" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#475569">branch</text>

  <rect x="580" y="118" width="300" height="190" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="730" y="158" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#c2410c">ECRリポジトリ</text>
  <text x="730" y="190" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#334155">Dockerイメージを保管</text>

  <polygon points="690,220 730,198 770,220 730,242" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <polygon points="690,220 730,242 730,286 690,264" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <polygon points="770,220 730,242 730,286 770,264" fill="#fdba74" stroke="#f97316" stroke-width="2"/>
  <text x="730" y="264" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#9a3412">image</text>
  <rect x="616" y="235" width="68" height="28" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="650" y="255" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#c2410c">v1.2.3</text>
  <rect x="776" y="235" width="68" height="28" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="810" y="255" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#c2410c">latest</text>

  <path d="M405 210h116" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M520 210l-18-14v28z" fill="#64748b"/>
  <rect x="397" y="233" width="154" height="54" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="474" y="255" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#334155">docker build</text>
  <text x="474" y="276" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#334155">docker push</text>

  <rect x="104" y="332" width="252" height="36" rx="18" fill="#dbeafe"/>
  <text x="230" y="356" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#1e40af">Git = 作り方</text>
  <rect x="628" y="332" width="204" height="36" rx="18" fill="#ffedd5"/>
  <text x="730" y="356" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#9a3412">ECR = 実行パッケージ</text>
</svg>
