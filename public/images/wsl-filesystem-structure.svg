<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title id="title">WindowsとWSL2のファイルシステムの関係</title>
  <desc id="desc">1台のPCの中に、WindowsとWSL2の仮想マシンがある。Windowsのプロセスは NTFS のCドライブを直接読み書きし、Linuxのプロセスは ext4 を直接読み書きする。Linuxのプロセスが /mnt/c からWindows側のファイルを読むときと、Windowsのプロセスが \\wsl.localhost からLinux側のファイルを読むときは、9Pプロトコルで仮想マシンの境界をまたぐ。Linux側のディスクの実体は、Cドライブ上の ext4.vhdx という1つのファイルである。</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>

  <rect x="1" y="1" width="798" height="618" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">1台のPCの中にある、2つのOSと2つのファイルシステム</text>

  <!-- Windows -->
  <rect x="30" y="70" width="320" height="440" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="100" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">Windows</text>

  <rect x="50" y="120" width="280" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="190" y="146" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Windowsのプロセス</text>
  <text x="190" y="176" font-size="14" fill="#334155" text-anchor="middle">エクスプローラー / メモ帳</text>
  <text x="190" y="201" font-size="14" fill="#334155" text-anchor="middle">PowerShell / コマンドプロンプト</text>
  <text x="190" y="226" font-size="12" fill="#64748b" text-anchor="middle">Windowsのカーネルの上で動く</text>

  <line x1="190" y1="242" x2="190" y2="330" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="200" y="291" font-size="13" fill="#1d4ed8">直接読み書き</text>

  <rect x="50" y="335" width="280" height="155" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">NTFS（Cドライブ）</text>
  <text x="190" y="390" font-size="13" fill="#334155" text-anchor="middle" font-family="Menlo,Consolas,monospace">C:\Users\taro\Documents</text>
  <rect x="70" y="408" width="240" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="190" y="432" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Menlo,Consolas,monospace">ext4.vhdx</text>
  <text x="190" y="456" font-size="11" fill="#64748b" text-anchor="middle">Linux側のディスクの実体（1つのファイル）</text>

  <!-- WSL2 VM -->
  <rect x="450" y="70" width="320" height="440" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="610" y="100" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">WSL2の仮想マシン（Ubuntu）</text>

  <rect x="470" y="120" width="280" height="120" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="610" y="146" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Linuxのプロセス</text>
  <text x="610" y="176" font-size="14" fill="#334155" text-anchor="middle">bash / zsh</text>
  <text x="610" y="201" font-size="14" fill="#334155" text-anchor="middle">git / node / npm</text>
  <text x="610" y="226" font-size="12" fill="#64748b" text-anchor="middle">Linuxカーネルの上で動く</text>

  <line x1="610" y1="242" x2="610" y2="330" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="620" y="291" font-size="13" fill="#c2410c">直接読み書き</text>

  <rect x="470" y="335" width="280" height="155" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="610" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ext4（Linuxのファイルシステム）</text>
  <text x="610" y="390" font-size="13" fill="#334155" text-anchor="middle" font-family="Menlo,Consolas,monospace">/home/taro/projects</text>
  <text x="610" y="430" font-size="12" fill="#64748b" text-anchor="middle">中身は左の ext4.vhdx に保存される</text>

  <!-- cross access via 9P -->
  <line x1="470" y1="215" x2="336" y2="396" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <line x1="330" y1="215" x2="464" y2="396" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <rect x="356" y="120" width="88" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="139" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">9P</text>
  <text x="400" y="157" font-size="11" fill="#dc2626" text-anchor="middle">境界をまたぐ</text>

  <!-- legend -->
  <line x1="40" y1="540" x2="90" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="104" y="545" font-size="14" fill="#0f172a">同じ側のファイル：直接読み書きする（速い）</text>
  <line x1="40" y1="570" x2="90" y2="570" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="104" y="575" font-size="14" fill="#0f172a">相手側のファイル：9Pで仮想マシンの境界をまたいで読み書きする（遅い）</text>
  <text x="40" y="602" font-size="13" fill="#334155">Linuxから見たWindows側 → <tspan font-family="Menlo,Consolas,monospace">/mnt/c/…</tspan>　　Windowsから見たLinux側 → <tspan font-family="Menlo,Consolas,monospace">\\wsl.localhost\Ubuntu\…</tspan></text>
</svg>
