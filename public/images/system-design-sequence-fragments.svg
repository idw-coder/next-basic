<svg xmlns="http://www.w3.org/2000/svg" width="800" height="770" viewBox="0 0 800 770" role="img" aria-labelledby="title desc">
  <title id="title">loop、opt、altの範囲</title>
  <desc id="desc">注文処理のシーケンス図。loopはカートの商品ごとに在庫確認を繰り返す範囲、optはクーポン指定があるときだけ検証する範囲、altは在庫がある場合は注文を保存して201を返し、在庫不足の場合は409を返す範囲を示す。</desc>
