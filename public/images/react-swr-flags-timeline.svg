<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">isLoadingとisValidatingの変化</title>
  <desc id="desc">初回読み込みではisLoadingとisValidatingの両方がtrue。データ取得後は両方false。再検証中はisValidatingだけがtrueになり、dataには古い値が入ったまま。完了後にdataが新しい値に変わる。</desc>
