<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">シーケンス図の読み方</title>
  <desc id="desc">ブラウザ、API、DBの3者のやり取りを示したシーケンス図。上の四角が参加者、下に伸びる破線がライフライン、実線の矢印がメッセージ、破線の矢印が戻りメッセージ、ライフライン上の細長い四角が処理中を示す活性区間。時間は上から下へ進む。</desc>
